name: Helm Linter

on:
  workflow_call:
    inputs:
      charts:
        description: 'JSON array of chart names to process'
        required: false
        type: string
        default: '[]'

jobs:
  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set charts variable
        id: set-charts
        run: |
          if [[ "${{ inputs.charts }}" != "[]" ]]; then
            echo "charts=${{ inputs.charts }}" >> "$GITHUB_OUTPUT"
            echo "✅ Processing charts from input: ${{ inputs.charts }}"
          else
            echo "charts=${{ steps.detect-charts.outputs.charts }}" >> "$GITHUB_OUTPUT"
            echo "✅ Processing charts from detection: ${{ steps.detect-charts.outputs.charts }}"
          fi
      - name: Lint Helm Charts
        run: |
          CHARTS_JSON="${{ steps.set-charts.outputs.charts }}"

          if [[ -z "$CHARTS_JSON" || "$CHARTS_JSON" == "[]" ]]; then
            echo "⚠️ No charts to lint."
            exit 0
          fi

          echo "Debug: CHARTS_JSON = $CHARTS_JSON"
          # Handle case where JSON strings aren't properly quoted
          FIXED_JSON=$(echo "$CHARTS_JSON" | sed 's/\[/["/' | sed 's/\]/"]/' | sed 's/,/","/g')
          echo "Debug: FIXED_JSON = $FIXED_JSON"
          FAILED=0
          while read -r CHART; do
            echo "🔍 Linting charts/$CHART"
            if ! helm lint "charts/$CHART"; then
              echo "::error file=charts/$CHART/Chart.yaml::helm lint failed for $CHART"
              FAILED=1
            fi
          done < <(printf '%s\n' "$FIXED_JSON" | jq -r '.[]')
          exit $FAILED

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      # helm lint checks chart structure, not whether Kubernetes accepts the result.
      # Rendering and validating against the API schema catches what lint cannot:
      # a probe port that renders as null, a key emitted twice, a map where a
      # string is required. Custom resources (cert-manager, Strimzi) are checked
      # against the community CRD catalog instead of being skipped.
      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          CHARTS_JSON="${{ steps.set-charts.outputs.charts }}"
          if [[ -z "$CHARTS_JSON" || "$CHARTS_JSON" == "[]" ]]; then
            echo "No charts to validate."
            exit 0
          fi
          FIXED_JSON=$(echo "$CHARTS_JSON" | sed 's/\[/["/' | sed 's/\]/"]/' | sed 's/,/","/g')
          CRD_CATALOG='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

          FAILED=0
          while read -r CHART; do
            # The umbrella needs its dependencies pulled first; its subcharts are validated on their own.
            [[ "$CHART" == "platform-stack" ]] && continue
            echo "🔎 Validating charts/$CHART"
            if ! helm template validate "charts/$CHART" \
                | kubeconform -strict -summary -output text \
                    -kubernetes-version 1.33.0 \
                    -schema-location default \
                    -schema-location "$CRD_CATALOG"; then
              echo "::error file=charts/$CHART/Chart.yaml::rendered manifests for $CHART fail Kubernetes schema validation"
              FAILED=1
            fi
          done < <(printf '%s\n' "$FIXED_JSON" | jq -r '.[]')
          exit $FAILED