name: Validate Charts on Release

on:
  workflow_call:
    inputs:
      charts:
        description: 'JSON array of chart names to process'
        required: false
        type: string
        default: '[]'

jobs:
  release-validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Detect changed charts if not provided
        id: detect-charts
        if: inputs.charts == '[]'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -oP 'charts/\K[^/]+' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')
          echo "charts=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed charts: $CHANGED"

      - name: Set charts variable
        id: set-charts
        run: |
          if [[ '${{ inputs.charts }}' != '[]' ]]; then
            CHARTS='${{ inputs.charts }}'
            echo "charts=$CHARTS" >> $GITHUB_OUTPUT
            echo "Processing charts: $CHARTS"
          else
            CHARTS='${{ steps.detect-charts.outputs.charts }}'
            echo "charts=$CHARTS" >> $GITHUB_OUTPUT
            echo "Processing charts: $CHARTS"
          fi

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run placeholder unit test
        run: |
          echo "Running empty unit tests (placeholder)"
          echo "This step is a placeholder for real unit test logic"

      - name: Run helm-unittest if tests exist
        run: |
          for CHART in $(echo '${{ steps.set-charts.outputs.charts }}' | jq -r '.[]'); do
            CHART_PATH="charts/$CHART"
            if [ -d "$CHART_PATH/tests" ]; then
              echo ">>> Running helm-unittest for $CHART_PATH"
              helm unittest "$CHART_PATH" || echo "Tests completed - check results above for actual test status"
            else
              echo "No unit tests in $CHART_PATH"
            fi
          done

      - name: Install yamale (schema validator)
        run: pip install yamale
        
      - name: Install chart-testing (ct)
        run: |
          CT_VERSION="v3.9.0"
          curl -sSL "https://github.com/helm/chart-testing/releases/download/$CT_VERSION/chart-testing_${CT_VERSION#v}_linux_amd64.tar.gz" -o ct.tar.gz
          tar -xzf ct.tar.gz
          sudo mv ct /usr/local/bin/


      - name: Lint charts with chart-testing (ct)
        run: |
          echo "Running ct lint to validate chart structure and values.schema.json"
          for CHART in $(echo '${{ steps.set-charts.outputs.charts }}' | jq -r '.[]'); do
            # Skip the umbrella chart (ems-platform-stack)
            if [[ "$CHART" == "ems-platform-stack" ]]; then
              echo "Skipping umbrella chart: $CHART"
              continue
            fi
            
            CHART_PATH="charts/$CHART"
            echo ">>> chart testing $CHART_PATH"
            ct lint --charts "$CHART_PATH" || {
              echo "::error file=$CHART_PATH::ct lint failed"
              exit 1
            }
          done