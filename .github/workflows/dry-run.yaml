name: Helm Dry Run Validation

on:
  workflow_call:
    inputs:
      charts:
        description: 'JSON array of chart names to process'
        required: false
        type: string
        default: '[]'

jobs:
  dryrun:
    name: Helm Dry Run Validation
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz \
            | tar -xz
          sudo mv kustomize /usr/local/bin/ 

      - name: Set up KinD cluster
        uses: helm/kind-action@v1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Detect changed charts if not provided
        id: detect-charts
        if: inputs.charts == '[]'
        run: |
          # Better git diff detection
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            git fetch origin ${{ github.event.pull_request.base.ref }}
          else
            BASE_REF="${{ github.event.before }}"
          fi
          
          # Handle case where before is all zeros (new branch)
          if [[ "$BASE_REF" == "0000000000000000000000000000000000000000" ]] || [[ -z "$BASE_REF" ]]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only $BASE_REF HEAD)
          fi
          
          # Extract chart names and create proper JSON array
          CHART_NAMES=$(echo "$CHANGED_FILES" | grep '^charts/' | cut -d'/' -f2 | sort -u | grep -v '^$')
          
          if [[ -z "$CHART_NAMES" ]]; then
            CHARTS_JSON="[]"
          else
            CHARTS_JSON=$(echo "$CHART_NAMES" | jq -R -s 'split("\n") | map(select(length > 0))')
          fi
          
          echo "charts=$CHARTS_JSON" >> $GITHUB_OUTPUT
          echo "Detected charts: $CHARTS_JSON"

      - name: Set charts variable
        id: set-charts
        run: |
          if [[ '${{ inputs.charts }}' != '[]' ]]; then
            CHARTS='${{ inputs.charts }}'
          else
            CHARTS='${{ steps.detect-charts.outputs.charts }}'
          fi
          
          echo "charts=$CHARTS" >> $GITHUB_OUTPUT
          echo "Processing charts: $CHARTS"
          
          # Validate JSON
          echo "$CHARTS" | jq . > /dev/null || {
            echo "Error: Invalid JSON format in charts variable"
            echo "Charts value: $CHARTS"
            exit 1
          }

      - name: Check if any charts to process
        id: check-charts
        run: |
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          CHART_COUNT=$(echo "$CHARTS" | jq '. | length')
          
          if [[ "$CHART_COUNT" -eq 0 ]]; then
            echo "has_charts=false" >> $GITHUB_OUTPUT
            echo "No charts to process"
          else
            echo "has_charts=true" >> $GITHUB_OUTPUT
            echo "Found $CHART_COUNT chart(s) to process"
          fi

      - name: Check if Strimzi CRDs are needed
        id: check-strimzi
        if: steps.check-charts.outputs.has_charts == 'true'
        run: |
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          NEED_STRIMZI="false"
          
          echo "Checking for Strimzi CRDs in charts..."
          while IFS= read -r CHART; do
            [[ -z "$CHART" ]] && continue
            echo "Checking chart: $CHART"
            
            if [[ -d "charts/$CHART/templates" ]]; then
              if find "charts/$CHART/templates" -name "*.yaml" -o -name "*.yml" | xargs grep -l -E 'kind:\s*(Kafka|KafkaNodePool)' 2>/dev/null; then
                echo "Strimzi CRDs required for chart: $CHART"
                NEED_STRIMZI="true"
                break
              fi
            fi
          done < <(echo "$CHARTS" | jq -r '.[]')
          
          echo "install_strimzi=$NEED_STRIMZI" >> $GITHUB_OUTPUT
          echo "Strimzi CRDs required: $NEED_STRIMZI"

      - name: Add Strimzi Helm repo
        if: steps.check-strimzi.outputs.install_strimzi == 'true'
        run: helm repo add strimzi https://strimzi.io/charts/

      - name: Install Strimzi CRDs
        if: steps.check-strimzi.outputs.install_strimzi == 'true'
        run: |
          helm upgrade --install ems-cluster-operator \
            oci://quay.io/strimzi-helm/strimzi-kafka-operator \
            -n kafka --create-namespace --version 0.45.0

          echo "Waiting for CRDs to be established..."
          kubectl wait --for condition=Established crd/kafkas.kafka.strimzi.io --timeout=60s || true
          kubectl wait --for condition=Established crd/kafkanodepools.kafka.strimzi.io --timeout=60s || true

      - name: Check if cert-manager CRDs are needed
        id: check-cert-manager
        if: steps.check-charts.outputs.has_charts == 'true'
        run: |
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          NEED_CERTS="false"
          
          echo "Checking for cert-manager CRDs in charts..."
          while IFS= read -r CHART; do
            [[ -z "$CHART" ]] && continue
            echo "Checking chart: $CHART"
            
            if [[ -d "charts/$CHART" ]]; then
              # Check templates directory
              if [[ -d "charts/$CHART/templates" ]]; then
                if find "charts/$CHART/templates" -name "*.yaml" -o -name "*.yml" | xargs grep -l -E 'apiVersion:\s*cert-manager\.io/v1|kind:\s*Certificate|kind:\s*Issuer|kind:\s*ClusterIssuer' 2>/dev/null; then
                  echo "Cert-manager CRDs required for chart: $CHART"
                  NEED_CERTS="true"
                  break
                fi
              fi
              
              # Check values files for cert-manager references
              if find "charts/$CHART" -name "values*.yaml" | xargs grep -l -E 'cert-manager|certificate' 2>/dev/null; then
                echo "Cert-manager references found in values for chart: $CHART"
                NEED_CERTS="true"
                break
              fi
            fi
          done < <(echo "$CHARTS" | jq -r '.[]')
          
          echo "need_crds=$NEED_CERTS" >> $GITHUB_OUTPUT
          echo "Cert-manager CRDs required: $NEED_CERTS"

      - name: Add cert-manager Helm repo
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install cert-manager CRDs
        if: steps.check-cert-manager.outputs.need_crds == 'true'
        run: |
          echo "Installing cert-manager CRDs..."
          kubectl apply --validate=false -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml
          
          echo "Waiting for cert-manager CRDs to be established..."
          kubectl wait --for condition=Established crd/certificates.cert-manager.io --timeout=60s || true
          kubectl wait --for condition=Established crd/issuers.cert-manager.io --timeout=60s || true
          kubectl wait --for condition=Established crd/clusterissuers.cert-manager.io --timeout=60s || true

      - name: Check if Gateway/Nginx CRDs are needed
        id: check-crds
        if: steps.check-charts.outputs.has_charts == 'true'
        run: |
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          NEED_GATEWAY="false"
          NEED_NGINX="false"

          echo "Checking charts for Gateway or NGINX CRDs..."
          while IFS= read -r CHART; do
          [[ -z "$CHART" ]] && continue
          echo "Checking chart: $CHART"

          if [[ -d "charts/$CHART/templates" ]]; then
              FILES=$(find "charts/$CHART/templates" -name "*.yaml" -o -name "*.yml")
        
            if  echo "$FILES" | xargs grep -qE 'kind:\s*(Gateway|HTTPRoute)'; then
              echo "Gateway API CRDs required for chart: $CHART"
              NEED_GATEWAY="true"
            fi

            if  echo "$FILES" | xargs grep -qE 'kind:\s*SnippetsFilter'; then
              echo "NGINX Gateway CRDs required for chart: $CHART"
              NEED_NGINX="true"
            fi
          fi
          done < <(echo "$CHARTS" | jq -r '.[]')

          echo "install_gateway_crds=$NEED_GATEWAY" >> $GITHUB_OUTPUT
          echo "install_nginx_crds=$NEED_NGINX" >> $GITHUB_OUTPUT

      - name: Set Gateway and NGINX CRD sources
        id: set-crd-sources
        if: steps.check-crds.outputs.install_gateway_crds == 'true' || steps.check-crds.outputs.install_nginx_crds == 'true'
        run: |
          echo "Setting CRD sources..."
          echo "Setting CRD source URLs from v1.5.1 release..."
          echo "gateway_api_crds_url=https://raw.githubusercontent.com/nginxinc/nginx-gateway-fabric/v1.5.1/config/crd/gateway-api/standard/gateway-api-crds.yaml" >> $GITHUB_OUTPUT
          echo "nginx_crds_url=https://raw.githubusercontent.com/nginxinc/nginx-gateway-fabric/v1.5.1/config/crd/gateway.nginx.org_snippetsfilters.yaml" >> $GITHUB_OUTPUT

      - name: Install Gateway and NGINX CRDs
        if: steps.check-crds.outputs.install_gateway_crds == 'true' || steps.check-crds.outputs.install_nginx_crds == 'true'
        run: |
          echo "Installing required CRDs..."

          if [ "${{ steps.check-crds.outputs.install_gateway_crds }}" = "true" ]; then
            echo "Installing Gateway API CRDs..."
            kustomize build "https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v1.5.1" | kubectl apply -f -
            echo "Waiting for Gateway CRDs to be established..."
            kubectl wait --for condition=Established crd/gateways.gateway.networking.k8s.io --timeout=60s || true
            kubectl wait --for condition=Established crd/httproutes.gateway.networking.k8s.io --timeout=60s || true
          fi

          if [ "${{ steps.check-crds.outputs.install_nginx_crds }}" = "true" ]; then
            echo "Installing NGINX SnippetsFilter CRD..."
            kubectl apply -f "https://raw.githubusercontent.com/nginxinc/nginx-gateway-fabric/v1.5.1/config/crd/bases/gateway.nginx.org_snippetsfilters.yaml"
            echo "Waiting for NGINX CRDs to be established..."
            kubectl wait --for condition=Established crd/snippetsfilters.gateway.nginx.org --timeout=60s || true
          fi


      - name: Dry-run with `helm template` (render test)
        if: steps.check-charts.outputs.has_charts == 'true'
        run: |
          echo "Running helm template for changed charts"
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          
          while IFS= read -r CHART; do
            [[ -z "$CHART" ]] && continue

            # Skip the umbrella chart (ems-platform-stack)
            if [[ "$CHART" == "ems-platform-stack" ]]; then
              echo "Skipping umbrella chart: $CHART"
              continue
            fi

            RELEASE_NAME=$(echo "$CHART" | tr '[:upper:]' '[:lower:]')
            echo ">>> Rendering charts/$CHART with helm template"
            helm template "$RELEASE_NAME" "charts/$CHART" || {
              echo "::error file=charts/$CHART::helm template failed"
              exit 1
            }
          done < <(echo "$CHARTS" | jq -r '.[]')

      - name: Dry-run with `helm install --dry-run --debug` (full install simulation)
        if: steps.check-charts.outputs.has_charts == 'true'
        run: |
          echo "Running helm install --dry-run for changed charts"
          CHARTS='${{ steps.set-charts.outputs.charts }}'
          
          while IFS= read -r CHART; do

            # Skip the umbrella chart (ems-platform-stack)
            if [[ "$CHART" == "ems-platform-stack" ]]; then
              echo "Skipping umbrella chart: $CHART"
              continue
            fi

            [[ -z "$CHART" ]] && continue
            chart_name=$(echo "$CHART" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
            echo ">>> Simulating install of $chart_name"
            helm install "$chart_name" "charts/$CHART" --dry-run --debug || {
              echo "::error file=charts/$CHART::helm install --dry-run failed"
              exit 1
            }
          done < <(echo "$CHARTS" | jq -r '.[]')