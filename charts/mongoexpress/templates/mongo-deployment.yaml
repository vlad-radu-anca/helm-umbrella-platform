{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
      - name: wait-for-dependency
        image: {{ .Values.initContainers.mongoImage.repo | default "docker.io/bitnami/mongodb" }}:{{ .Values.initContainers.mongoImage.tag | default "8.0.6-debian-12-r0" }}
        env:
          - name: MONGO_USERNAME
            valueFrom:
              secretKeyRef:
                name: external-mongo-emsdb-secret
                key: mongo-username
          - name: MONGO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-mongo-emsdb-secret
                key: mongo-password
        command: ['bash', '-c', 'until mongosh "{{ .Values.ConnectionUrls.mongo.uri }}" --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"; do echo "Waiting for MongoDB to be available"; sleep 2; done;']
      containers:
      - name: mongo-express
        image: mongo-express:1.0.0-alpha.4
        ports:
        - containerPort: 8081
          name: express
        envFrom:
          - configMapRef:
              name: mongo-express-config-env
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME
            value: "root-user"
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: external-mongo-admin-secret
                key: mongodb-root-password
          - name: ME_CONFIG_BASICAUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: external-ems-aoa-client
                key: ems-username
          - name: ME_CONFIG_BASICAUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-ems-aoa-client
                key: ems-password
{{- end }}