{{- if .Values.swagger.smallcell_support.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: swagger
  labels:
    {{- include "swagger.labels" . | nindent 4 }}
spec:
  type: {{ .Values.swagger.service.type }}
  ports:
    - port: {{ .Values.swagger.service.port }}
      targetPort: 42002
      protocol: TCP
      name: http
  selector:
    {{- include "swagger.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-headless
  labels:
    {{- include "swagger.labels" . | nindent 4 }}
spec:
  clusterIP: None
  type: ClusterIP
  ports:
    - port: {{ .Values.swagger.service.port }}
      targetPort: 42002
      protocol: TCP
      name: http
  selector:
    {{- include "swagger.selectorLabels" . | nindent 4 }}
{{- end }}