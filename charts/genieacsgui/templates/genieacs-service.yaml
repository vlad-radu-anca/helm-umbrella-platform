{{- if .Values.cpeSupport.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: genieacsgui
  labels:
    {{- include "genieacsgui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "genieacsgui.selectorLabels" . | nindent 4 }}
{{- end }}