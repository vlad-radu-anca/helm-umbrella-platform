{{- if .Values.tus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tus-consumer
  labels:
    {{- include "tus.labels" . | nindent 4 }}
    app: tus-consumer
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  selector:
    {{- include "tus.selectorLabels" . | nindent 4 }}
    app: tus-consumer
{{- end }}