{{- if .Values.coreApi.hpa.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: core-api
  maxReplicas: {{ .Values.coreApi.hpa.maxReplicas }}
  minReplicas: {{ .Values.coreApi.hpa.minReplicas }}
  metrics:
    {{- if .Values.coreApi.hpa.averageCpuUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.coreApi.hpa.averageCpuUtilization }}
    {{- end }}
    {{- if .Values.coreApi.hpa.averageMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          AverageUtilization: {{ .Values.coreApi.hpa.averageMemoryUtilization }}
    {{- end }}
{{- end }}