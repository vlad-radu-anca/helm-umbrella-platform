suite: test core-api ingress
templates:
  - core-api-ingress.yaml
tests:
  - it: should not render when ingress is disabled
    set:
      coreApi:
        ingress:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ingress when enabled
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: should use correct API version for Kubernetes 1.19+
    capabilities:
      majorVersion: 1
      minorVersion: 19
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1

  - it: should use correct API version for Kubernetes 1.14-1.18
    capabilities:
      majorVersion: 1
      minorVersion: 18
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1beta1

  - it: should use extensions API version for older Kubernetes
    capabilities:
      majorVersion: 1
      minorVersion: 13
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - isAPIVersion:
          of: extensions/v1beta1

  - it: should have correct metadata name using fullname helper
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-core-api-helm

  - it: should include proper labels
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: core-api-helm
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should include annotations when provided
    set:
      coreApi:
        ingress:
          enabled: true
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]
          value: /
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "true"

  - it: should set ingress class name for Kubernetes 1.18+
    capabilities:
      majorVersion: 1
      minorVersion: 19
    set:
      coreApi:
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should add ingress class annotation for older Kubernetes versions
    capabilities:
      majorVersion: 1
      minorVersion: 17
    set:
      coreApi:
        ingress:
          enabled: true
          className: nginx
          annotations: {}
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: nginx

  - it: should configure TLS when provided
    set:
      coreApi:
        ingress:
          enabled: true
          tls:
            - secretName: core-api-tls
              hosts:
                - core-api.example.com
                - core-api.staging.com
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: core-api-tls
      - contains:
          path: spec.tls[0].hosts
          content: core-api.example.com

  - it: should create correct rule with endpoint substitution
    capabilities:
      majorVersion: 1
      minorVersion: 19
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /api
                  pathType: Prefix
                - path: /health
                  pathType: Exact
        service:
          port: 9000
      endpoint: mycompany.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: core-api.mycompany.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /health
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Exact

  - it: should configure backend service for Kubernetes 1.19+
    capabilities:
      majorVersion: 1
      minorVersion: 19
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: core-api
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9000

  - it: should configure backend service for older Kubernetes versions
    capabilities:
      majorVersion: 1
      minorVersion: 18
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.serviceName
          value: core-api
      - equal:
          path: spec.rules[0].http.paths[0].backend.servicePort
          value: 9000

  - it: should handle multiple hosts
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
            - host: core-api.staging.com
              paths:
                - path: /api
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: core-api.example.com
      - equal:
          path: spec.rules[1].host
          value: core-api.example.com

  - it: should handle multiple paths per host
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
                - path: /api
                  pathType: Prefix
                - path: /health
                  pathType: Exact
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /health

  - it: should not include pathType for older Kubernetes versions
    capabilities:
      majorVersion: 1
      minorVersion: 17
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - notExists:
          path: spec.rules[0].http.paths[0].pathType

  - it: should handle multiple TLS entries
    set:
      coreApi:
        ingress:
          enabled: true
          tls:
            - secretName: core-api-tls
              hosts:
                - core-api.example.com
            - secretName: core-api-backup-tls
              hosts:
                - core-api.example.com
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: core-api-tls
      - equal:
          path: spec.tls[1].secretName
          value: core-api-backup-tls
      - contains:
          path: spec.tls[0].hosts
          content: core-api.example.com
      - contains:
          path: spec.tls[1].hosts
          content: core-api.example.com

  - it: should work with different service ports
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 8080
      endpoint: example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.servicePort
          value: 8080

  - it: should work with different endpoints
    set:
      coreApi:
        ingress:
          enabled: true
          hosts:
            - host: core-api.example.com
              paths:
                - path: /
                  pathType: Prefix
        service:
          port: 9000
      endpoint: staging.mycompany.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: core-api.staging.mycompany.com
      - contains:
          path: spec.tls[0].hosts
          content: core-api.staging.mycompany.com