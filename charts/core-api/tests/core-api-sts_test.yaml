suite: test core-api statefulset
templates:
  - core-api-sts.yaml
tests:
  - it: should render StatefulSet
    set:
      coreApi:
        replicaCount: 3
        image: core-api-app
        tag: v1.0.0
        pullPolicy: IfNotPresent
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
          onprem: http://keycloak-onprem:8080
      initContainers:
        curlImage:
          repo: curlimages/curl
          tag: 8.12.1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - isAPIVersion:
          of: apps/v1

  - it: should have correct metadata
    set:
      coreApi:
        replicaCount: 3
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: metadata.name
          value: core-api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: core-api-helm
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have correct spec configuration
    set:
      coreApi:
        replicaCount: 5
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.replicas
          value: 5
      - equal:
          path: spec.serviceName
          value: core-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: core-api-helm
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have correct security context
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001

  - it: should have priority class name
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: ems-platform-high-priority

  - it: should have correct init containers for aws platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
          onprem: http://keycloak-onprem:8080
      initContainers:
        curlImage:
          repo: curlimages/curl
          tag: 8.12.1
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-dependency
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: curlimages/curl:8.12.1
      - equal:
          path: spec.template.spec.initContainers[0].env[0].valueFrom.secretKeyRef.name
          value: elastic-admin-client
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-keycloak
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: ".*http://keycloak-aws:8080.*"

  - it: should have correct init containers for onprem platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: onprem
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
          onprem: http://keycloak-onprem:8080
      initContainers:
        curlImage:
          repo: curlimages/curl
          tag: 8.12.1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env[0].valueFrom.secretKeyRef.name
          value: internal-elastic-admin-client
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: ".*http://keycloak-onprem:8080.*"

  - it: should have correct main container configuration
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v2.0.0
        pullPolicy: Always
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: core-api
      - equal:
          path: spec.template.spec.containers[0].image
          value: "core-api-app:v2.0.0"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2000m"

  - it: should have correct container ports
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 3
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9000
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9002
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: akka-cluster
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 8558
      - equal:
          path: spec.template.spec.containers[0].ports[2].name
          value: akka-management

  - it: should have correct probes configuration
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /diesel/rest/v1/ems/local/started
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 9000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /diesel/rest/diesel/ping
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /diesel/rest/diesel/ping

  - it: should have correct environment variables
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 2
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: core-api-config-env
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].configMapRef.name
          value: elastic-host-env
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOST
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: should have correct volume mounts
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 5
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: core-api-properties
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /home/razvanc/rk/dist/conf/logback.prod.xml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: logback.core-api.xml

  - it: should have correct volumes for aws platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 5
      - equal:
          path: spec.template.spec.volumes[0].name
          value: core-api-properties
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: core-api-properties
      - equal:
          path: spec.template.spec.volumes[1].name
          value: keycloak-admin-client-secrets
      - equal:
          path: spec.template.spec.volumes[1].csi.driver
          value: secrets-store.csi.k8s.io
      - equal:
          path: spec.template.spec.volumes[1].csi.volumeAttributes.secretProviderClass
          value: external-keycloak-admin-client

  - it: should have correct volumes for onprem platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: onprem
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          onprem: http://keycloak-onprem:8080
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: keycloak-admin-client-secrets
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: external-keycloak-admin-client
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: internal-keycloak-core-api-client
      - equal:
          path: spec.template.spec.volumes[3].secret.secretName
          value: internal-elastic-admin-client
      - equal:
          path: spec.template.spec.volumes[4].secret.secretName
          value: internal-pg-client

  - it: should include pod annotations when provided
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        podAnnotations:
          annotation1: value1
          annotation2: value2
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.metadata.annotations.annotation1
          value: value1
      - equal:
          path: spec.template.metadata.annotations.annotation2
          value: value2

  - it: should include image pull secrets when provided
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        imagePullSecrets:
          - name: my-registry-secret
          - name: another-secret
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 2
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-registry-secret
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: another-secret

  - it: should include node selector for aws platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        nodeSelector:
          aws:
            node-type: aws-worker
            zone: us-east-1a
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-type"]
          value: aws-worker
      - equal:
          path: spec.template.spec.nodeSelector.zone
          value: us-east-1a

  - it: should include node selector for onprem platform
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        nodeSelector:
          onprem:
            node-type: onprem-worker
            datacenter: dc1
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: onprem
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          onprem: http://keycloak-onprem:8080
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-type"]
          value: onprem-worker
      - equal:
          path: spec.template.spec.nodeSelector.datacenter
          value: dc1

  - it: should include affinity when provided
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values:
                        - amd64
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - notEqual:
          path: spec.template.spec.affinity
          value: null
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch

  - it: should include tolerations when provided
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        tolerations:
          - key: "key1"
            operator: "Equal"
            value: "value1"
            effect: "NoSchedule"
          - key: "key2"
            operator: "Exists"
            effect: "NoExecute"
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 2
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: key1
      - equal:
          path: spec.template.spec.tolerations[1].operator
          value: Exists

  - it: should use default curl image when not specified
    set:
      coreApi:
        replicaCount: 1
        image: core-api-app
        tag: v1.0.0
        secrets:
          external_keycloak_admin_client: external-keycloak-admin-client
          internal_keycloak_core_api_client: internal-keycloak-core-api-client
          internal_elastic_client: internal-elastic-client
          internal_pg_client: internal-pg-client
        internal_cluster_hostname: core-api-headless
      platform: aws
      ConnectionUrls:
        elastic: http://elasticsearch:9200
        keycloak:
          aws: http://keycloak-aws:8080
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: curlimages/curl:8.12.1
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: curlimages/curl:8.12.1