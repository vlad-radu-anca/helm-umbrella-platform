{{- if .Values.ngf_enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2
spec:
  parentRefs:
  - name: ems
  hostnames:
    - {{ include "ngf.hostname" . }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /oauth2/auth
    backendRefs:
    - name: oauth2-proxy
      port: 80
{{- end }}