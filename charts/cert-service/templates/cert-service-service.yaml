{{- if .Values.smallcell_support.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: cert-service
  labels:
    {{- include "certservice.labels" . | nindent 4 }}
  annotations:
    metallb.universe.tf/allow-shared-ip: "key-to-share-1.2.3.4"
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" .Values.dev_mode }}
  {{- if .Values.dev_mode }}
  loadBalancerIP: {{ .Values.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.certservice.service.port }}
      targetPort: 7702
      protocol: TCP
      name: http
  {{- if .Values.dev_mode }}
    - port: 40002
      targetPort: 40002
      protocol: TCP
      name: debug
  {{- end }}

  selector:
    {{- include "certservice.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cert-service-headless
  labels:
    {{- include "certservice.labels" . | nindent 4 }}
spec:
  clusterIP: None
  type: ClusterIP
  ports:
    - port: {{ .Values.certservice.service.port }}
      targetPort: 7702
      protocol: TCP
      name: http
  selector:
    {{- include "certservice.selectorLabels" . | nindent 4 }}
{{- end }}