{{- if .Values.helpcenter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: help-center
  labels:
    app.kubernetes.io/name: help-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: help-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: help-center
    spec:
      {{- if eq (include "platform" .) "aws" }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- end }}
      {{- with .Values.helpcenter.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: platform-high-priority
      initContainers:
        - name: copy-nginx-content
          image: "{{ .Values.helpcenter.image }}:{{ .Values.helpcenter.tag }}"
          command:
            - sh
            - -c
            - |
              if [ ! -d "/tmp/nginx-content/assets" ]; then
                echo "Directory structure does not exist, copying files...";
                cp -R /usr/share/nginx/html/* /tmp/nginx-content/ ;
              else
                echo "Directory structure exists, skipping copy";
              fi || true
          volumeMounts:
            - name: help-center-storage
              mountPath: /tmp/nginx-content
          securityContext:
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: helpcenter
          image: "{{ .Values.helpcenter.image }}:{{ .Values.helpcenter.tag }}"
          imagePullPolicy: {{ .Values.helpcenter.pullPolicy }}
          ports:
            - containerPort: 9094
              name: http
            - containerPort: 3002
              name: internal
          resources:
            {{- toYaml .Values.helpcenter.resources | nindent 12 }}
          volumeMounts:
            - name: help-center-storage
              mountPath: {{ .Values.helpcenter.local.volumeMountPaths }}
            - name: keycloak-config
              mountPath: /usr/share/nginx/html/assets/configs/keycloak.json
              subPath: keycloak.json
            - name: app-config
              mountPath: /usr/share/nginx/html/assets/configs/app.json
              subPath: app.json
            - name: hc-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- if eq (include "platform" .) "aws" }}
            - name: github-secrets-hc
              mountPath: /opt/platform/config/github
              readOnly: true
            {{- else if eq (include "platform" .) "onprem" }}
            - name: github-credentials
              mountPath: /opt/platform/config/github
              readOnly: true
            {{- end }}
      restartPolicy: Always
      {{- if eq (include "platform" .) "aws" }}
      {{- with .Values.helpcenter.nodeSelector.aws }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else if eq (include "platform" .) "onprem" }}
      {{- with .Values.helpcenter.nodeSelector.onprem }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helpcenter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helpcenter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: help-center-storage
          persistentVolumeClaim:
            claimName: help-center-pvc
        - name: keycloak-config
          configMap:
            name: help-center-keycloak-config
        - name: app-config
          configMap:
            name: help-center-app-config
        - name: hc-nginx-config
          configMap:
            name: hc-nginx-config
        {{- if eq (include "platform" .) "aws" }}
        - name: github-secrets-hc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.secrets.internal_gh_help_center_repo_client | replace "_" "-" }}"
        {{- else if eq (include "platform" .) "onprem" }}
        - name: github-credentials
          secret:
            secretName: github-credentials
        {{- end }}
      {{- end }}
    {{- end }}
