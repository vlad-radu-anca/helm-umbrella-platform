{{- if .Values.helpcenter.enabled }}
---
apiVersion: v1
data:
  app.json: |
    {
      "isPublic": false,
      "versions": [4, 5]
    }
kind: ConfigMap
metadata:
  name: help-center-app-config
{{- end }}
---
apiVersion: v1
data:
  keycloak.json: |
    {
      "auth-server-url": "https://{{ .Values.helpcenter.webui_subdomain }}.{{ .Values.endpoint }}/auth",
      "realm": "DefaultTenant",
      "resource": "help-center"
    }

kind: ConfigMap
metadata:
  name: help-center-keycloak-config