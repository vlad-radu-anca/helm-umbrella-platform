suite: test service
templates:
  - api-gw-service.yaml
tests:
  - it: should not render when smallcell_support is disabled
    set:
      apigw.smallcell_support.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render both services when smallcell_support is enabled
    set:
      apigw.smallcell_support.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should create regular service with correct configuration
    documentIndex: 0
    set:
      apigw.smallcell_support.enabled: true
      apigw.service.type: ClusterIP
      apigw.service.port: 7702
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: apigw
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 7702
      - equal:
          path: spec.ports[0].targetPort
          value: 7702
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.ports[0].name
          value: http

  - it: should create headless service with correct configuration
    documentIndex: 1
    set:
      apigw.smallcell_support.enabled: true
      apigw.service.port: 7702
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: apigw-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 7702
      - equal:
          path: spec.ports[0].targetPort
          value: 7702

  - it: should use NodePort service type when configured
    documentIndex: 0
    set:
      apigw.smallcell_support.enabled: true
      apigw.service.type: NodePort
      apigw.service.port: 7702
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should use LoadBalancer service type when configured
    documentIndex: 0
    set:
      apigw.smallcell_support.enabled: true
      apigw.service.type: LoadBalancer
      apigw.service.port: 7702
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should have correct selector labels
    documentIndex: 0
    set:
      apigw.smallcell_support.enabled: true
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: apigw-helm
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should include proper labels
    documentIndex: 0
    set:
      apigw.smallcell_support.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: apigw-helm
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm