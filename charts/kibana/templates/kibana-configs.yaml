---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-elastic-host-env
data:
  ELASTIC_HOST: elastic
  ELASTIC_PORT: "9200"
  ELASTIC_URL: "{{ .Values.ConnectionUrls.elastic }}"
  ELASTICSEARCH_HOSTS: "{{ .Values.ConnectionUrls.elastic }}"
  {{- if eq .Values.platform "aws" }}
  WAITFORIT_HOST: elastic
  WAITFORIT_PORT: "9200"
  WAITFORIT_URL: "{{ .Values.ConnectionUrls.elastic }}"
  {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
data:
  KIBANA_HOST: kibana
  KIBANA_HOST_AND_PORT: kibana:5601
  KIBANA_PORT: "5601"
  {{- if eq .Values.platform "aws" }}
  WAITFORIT_URL: "http://kibana:5601/login"
  {{- end }}
