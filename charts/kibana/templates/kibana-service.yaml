apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    {{- include "kibana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kibana.service.type }}
  ports:
    - name: http
      port: {{ .Values.kibana.service.port }}
      protocol: TCP
      targetPort: 5601
  selector:
    {{- include "kibana.selectorLabels" . | nindent 4 }}
