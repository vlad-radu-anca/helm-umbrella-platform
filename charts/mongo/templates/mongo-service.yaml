{{- if .Values.cpeSupport.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 27017
      protocol: TCP
      name: http
  selector:
    {{- include "mongo.selectorLabels" . | nindent 4 }}
{{- end }}