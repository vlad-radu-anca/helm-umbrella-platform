{{- if eq (include "platform" .) "aws" }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elastic-backup
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "{{ .Values.fsid }}::{{ .Values.fsaccesspoint }}"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elastic-backup
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi

{{- else if eq (include "platform" .) "onprem" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elastic-backup
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  annotations:
    volumeType: local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
{{- end }}
