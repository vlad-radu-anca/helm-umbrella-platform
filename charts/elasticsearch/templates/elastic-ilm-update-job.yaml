{{- if .Values.elasticsearch.retention.Job }}
apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-ilm-job
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-elastic
          image: {{ .Values.initContainers.curlImage.repo | default "curlimages/curl" }}:{{ .Values.initContainers.curlImage.tag | default "8.12.1" }}
          command: ["/bin/sh", "-c"]
          env:
            - name: ELK_USERNAME
              valueFrom:
                secretKeyRef:
                  {{- if eq (include "platform" .) "onprem" }}
                  name: internal-elastic-admin-client
                  {{- else if eq (include "platform" .) "aws" }}
                  name: elastic-admin-client
                  {{- end }}
                  key: elk-username
            - name: ELK_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if eq (include "platform" .) "onprem" }}
                  name: internal-elastic-admin-client
                  {{- else if eq (include "platform" .) "aws" }}
                  name: elastic-admin-client 
                  {{- end }}
                  key: elk-password
          args:
            - >
              while [[ $(curl -sw '%{http_code}' -u "$ELK_USERNAME:$ELK_PASSWORD" {{ .Values.elasticjob.ConnectionUrls.elastic }} -o /dev/null) -ne 200 ]]; do
                sleep 5;
                echo 'Waiting for Elasticsearch...';
              done;
              echo 'Elasticsearch is ready!'
      restartPolicy: Never
      containers:
        - image: {{ .Values.initContainers.curlImage.repo | default "curlimages/curl" }}:{{ .Values.initContainers.curlImage.tag | default "8.12.1" }}
          imagePullPolicy: {{ .Values.job.elastic.pullPolicy }}
          name: retention-elastic-job
          command: ["/bin/sh", "-c", "--"]
          env:
            - name: ELK_USERNAME
              valueFrom:
                secretKeyRef:
                  {{- if eq (include "platform" .) "onprem" }}
                  name: internal-elastic-admin-client
                  {{- else if eq (include "platform" .) "aws" }}
                  name: elastic-admin-client
                  {{- end }}
                  key: elk-username
            - name: ELK_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if eq (include "platform" .) "onprem" }}
                  name: internal-elastic-admin-client
                  {{- else if eq (include "platform" .) "aws" }}
                  name: elastic-admin-client 
                  {{- end }}
                  key: elk-password
          args:
            - >
              curl -sS -XPUT -u "$ELK_USERNAME:$ELK_PASSWORD" "{{ .Values.elasticJob.ConnectionUrls.elastic }}/_ilm/policy/realtime-policy?pretty" \
              -H 'Content-Type: application/json' \
              -d '{
                    "policy": {
                      "phases": {
                        "hot": {
                          "min_age": "0ms",
                          "actions": {
                            "rollover": {
                              "max_age": "1d",
                              "max_size": "5gb"
                            },
                            "set_priority": {
                              "priority": 5
                            }
                          }
                        },
                        "delete": {
                          "min_age": "{{ .Values.elasticsearch.retention.realtime }}",
                          "actions": {
                            "delete": {}
                          }
                        }
                      }
                    }
                  }'
          ports:
            - containerPort: 9200
            - containerPort: 9300
          resources: {}
{{- end }}
