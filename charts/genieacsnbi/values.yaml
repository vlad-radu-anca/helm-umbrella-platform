  tag: latest
  pullPolicy: Always
initContainers:
  busyboxImage:
    repo: busybox
    tag: 1.36.1
  curlImage:
    repo: curlimages/curl
    tag: 8.12.1

securityContext:
  fsGroup: 2000
  runAsUser: 2500
  runAsGroup: 2500
