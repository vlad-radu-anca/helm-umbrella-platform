platform: onprem
cpeSupport:
  enabled: true
image: ghcr.io/vlad-radu-anca/genieacs-nbi
tag: latest
pullPolicy: Always
replicaCount: 1
imagePullSecrets: []
podAnnotations: {}
tolerations: []
resources: {}
nodeSelector:
  onprem: {}
  aws: {}
affinity: {}
service:
  type: ClusterIP
  port: 7557
