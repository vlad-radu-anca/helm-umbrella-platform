{{- if .Values.cpeSupport.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: genieacsnbi
  labels:
    {{- include "genieacsnbi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 7557
      protocol: TCP
      name: nbi
  selector:
    {{- include "genieacsnbi.selectorLabels" . | nindent 4 }}
{{- end }}