---
apiVersion: v1
kind: Service
metadata:
  name: emsui
  labels:
    {{- include "emsui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.emsui.service.type }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "emsui.selectorLabels" . | nindent 4 }}