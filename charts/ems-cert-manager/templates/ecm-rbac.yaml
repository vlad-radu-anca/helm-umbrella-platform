---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecm-sa
  namespace: ems-platform
  {{- if eq .Values.platform "aws" }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.emscertmanager.secrets.secrets_store_csi_role_arn }}"
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecm-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecm-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ecm-sa
    namespace: ems-platform
