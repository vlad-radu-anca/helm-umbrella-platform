platform: onprem

cts:
  enabled: true
  image: vlad-radu-anca/cts
  tag: 5.0.latest
  pullPolicy: Always
  replicaCount: 2
  imagePullSecrets: [name: "regcred"]
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 7701
  resources:
    limits:
      cpu: 800m
      memory: 1000Mi
    requests:
      cpu: 250m
      memory: 500Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 90
    targetMemoryUtilizationPercentage: 90
  nodeSelector:
    aws:
      karpenter-node: ems-platform-autoscalernode-large
    onprem: {}
    default:
  tolerations: []
  affinity: {}
  dev_mode: false
  ConnectionUrls:
    coreApi: http://core-api:9000
    elastic: http://elastic:9200
    keycloak:
      aws: http://keycloak-headless.keycloak.svc.cluster.local:8080/auth
      onprem: http://keycloak/auth
    spark: http://spark:4041
    mongo:
      aws:
        uri: mongodb+srv://cluster0.example.mongodb.net
      onprem:
        uri: mongodb://mongo-tenant:27017/?serverSelectionTimeoutMS=4000&replicaSet=rs0
    pgDb:
      dbname: ems-platform
      host: postgresql-hl
      port: 5432
  dbs:
    mongo:
      name: tocdb
  smallcell_support:  # small cell 5g support
    enabled: true
  keycloak:
    clientSecret: "changeme"
  # GitHub repository holding CTD definitions; override token via --set or a values file, never commit it
  repo:
    name: "ems-ctd"
    user: "changeme"
    token: "changeme"
  secrets:
    internal_pg_client: "ems-platform_internal_pg_client_xlv"
    internal_elastic_client: "ems-platform_internal_elastic_client_xlv"
    internal_keycloak_toc_client: "ems-platform_internal_keycloak_toc_client_xlv"
    internal_gh_ctd_repo_client: "ems-platform_internal_gh_ctd_repo_client_xlv"
  initContainers:
    mongoImage:
      repo: public.ecr.aws/bitnami/mongodb
      tag: 8.0.6-debian-12-r0
    curlImage:
      repo: curlimages/curl
      tag: 8.12.1

securityContext:
  fsGroup: 10000
  runAsUser: 10000
  runAsGroup: 10000
